name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Чтобы ошибка в одной версии не отменяла остальные тесты
      matrix:
        include:
          - react-version: 16.8.6
            rtl-version: 12.1.5
          - react-version: 17.0.2
            rtl-version: 12.1.5
          - react-version: 18.2.0
            rtl-version: 14.3.1
          - react-version: 19.0.0
            rtl-version: 16.3.1

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Setup React ${{ matrix.react-version }} and RTL ${{ matrix.rtl-version }}
        run: |
          pnpm add react@${{ matrix.react-version }} react-dom@${{ matrix.react-version }} @testing-library/react@${{ matrix.rtl-version }} -D --ignore-scripts

      - name: Run Tests
        run: pnpm test

  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install
      - run: pnpm tsc
      - run: pnpm build
